name: Deploy lookup backend to Render

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "render.yaml"
      - ".github/workflows/deploy-render.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Render credentials
        id: creds
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          if [ -z "${RENDER_API_KEY}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "RENDER_API_KEY not set — skipping Render sync/deploy."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push runtime secrets to Render
        if: steps.creds.outputs.configured == 'true'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          VMS_DATABASE_URL: ${{ secrets.VMS_DATABASE_URL }}
          VMS_DATABASE_SSL: ${{ secrets.VMS_DATABASE_SSL }}
        run: |
          set -euo pipefail

          put_env() {
            key="$1"
            value="$2"
            curl --fail --silent --show-error \
              -X PUT "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/env-vars/${key}" \
              -H "Authorization: Bearer ${RENDER_API_KEY}" \
              -H "Content-Type: application/json" \
              --data "$(jq -n --arg value "${value}" '{value: $value}')"
          }

          if [ -n "${VMS_DATABASE_URL}" ]; then
            put_env VMS_DATABASE_URL "${VMS_DATABASE_URL}"
          fi
          if [ -n "${VMS_DATABASE_SSL}" ]; then
            put_env VMS_DATABASE_SSL "${VMS_DATABASE_SSL}"
          fi

      - name: Trigger Render deploy
        if: steps.creds.outputs.configured == 'true'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -X POST "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            --data '{}'
